name: Build Android APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter source archive
        run: tar -xJf weather_glass_source.tar.xz

      - name: Apply premium three-tab UI patch
        run: |
          cat ci/premium-patch/part-*.b64 | base64 --decode > /tmp/weather_glass_premium_patch.tar.xz
          tar -xJf /tmp/weather_glass_premium_patch.tar.xz -C weather_glass_project

      - name: Apply weather controller state patch
        run: |
          base64 --decode ci/controller-patch.b64 > /tmp/weather_glass_controller_patch.tar.xz
          tar -xJf /tmp/weather_glass_controller_patch.tar.xz -C weather_glass_project

      - name: Apply analyzer lint cleanup
        run: |
          base64 --decode ci/lint-patch.b64 > /tmp/weather_glass_lint_patch.tar.xz
          tar -xJf /tmp/weather_glass_lint_patch.tar.xz -C weather_glass_project

      - name: Apply Flutter stable compatibility fixes
        run: bash ci_fixups.sh

      - name: Apply Persian branding and Jalali calendar patch
        run: |
          base64 --decode ci/branding-jalali-patch.b64 > /tmp/weather_glass_branding_patch.tar.xz
          tar -xJf /tmp/weather_glass_branding_patch.tar.xz -C weather_glass_project
          python3 weather_glass_project/tool/apply_branding_strings.py

      - name: Install bundled Vazirmatn fonts
        run: |
          mkdir -p weather_glass_project/assets/fonts
          cp ci/branding-assets/fonts/*.ttf weather_glass_project/assets/fonts/
          cp ci/branding-assets/fonts/OFL.txt weather_glass_project/assets/fonts/

      - name: Generate custom weather launcher artwork
        working-directory: weather_glass_project
        run: python3 tool/create_weather_icons.py

      - name: Generate Android host and apply Persian app label
        working-directory: weather_glass_project
        run: bash tool/bootstrap_android.sh

      - name: Verify Persian branding configuration
        working-directory: weather_glass_project
        run: |
          grep -q 'android:label="هواشناسی"' tool/AndroidManifest.xml
          grep -q 'shamsi_date: \^1.1.1' pubspec.yaml
          grep -q 'family: Vazirmatn' pubspec.yaml
          test -s assets/fonts/Vazirmatn-Regular.ttf
          test -s assets/icon/weather_icon.png
          test -s assets/icon/weather_icon_foreground.png

      - name: Install Flutter dependencies
        working-directory: weather_glass_project
        run: flutter pub get

      - name: Generate native Android launcher icons
        working-directory: weather_glass_project
        run: dart run flutter_launcher_icons

      - name: Upload source snapshot for validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-glass-source-inspection
          path: |
            weather_glass_project/lib/**
            weather_glass_project/assets/**
            weather_glass_project/pubspec.yaml
            weather_glass_project/tool/**
            weather_glass_project/android/app/src/main/AndroidManifest.xml
            weather_glass_project/android/app/src/main/res/mipmap-*/ic_launcher.png
          if-no-files-found: warn
          retention-days: 1

      - name: Analyze source
        working-directory: weather_glass_project
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: weather_glass_project
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: weather_glass_project
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-glass-release-apk
          path: weather_glass_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
